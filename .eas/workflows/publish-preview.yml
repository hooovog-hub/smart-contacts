# Publishes a JS update of apps/mobile to the "preview" branch.
# Runs on every push to main that touches the app, or manually.
# Open on iPhone: Expo Go → sign in → project "smart-contacts" → branch "preview".
name: Publish preview update

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']

jobs:
  update:
    name: Publish update for Expo Go
    steps:
      - uses: eas/checkout
      - name: Install
        working_directory: ./apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Publish update
        working_directory: ./apps/mobile
        run: npx -y eas-cli@latest update --branch preview --platform ios --non-interactive --message "Auto: ${{ github.sha || 'manual' }}"
