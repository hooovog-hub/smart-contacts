# Publishes a JS update to the "preview" branch on every push to main that touches the app.
# Open on iPhone: Expo Go → project "smart-contacts" → preview (or scan the QR from expo.dev).
name: Publish preview update

on:
  push:
    branches: ['main']
    paths: ['apps/mobile/**']

jobs:
  update:
    name: Publish update for Expo Go
    type: update
    params:
      branch: preview
      platform: ios
