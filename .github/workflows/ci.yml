name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      # --ignore-scripts: checks need only sources and types, not native binaries / git hooks.
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
