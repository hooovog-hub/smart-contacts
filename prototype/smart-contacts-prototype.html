<title>Smart Contacts</title>
<style>
/* Layout: one-screen phone app — header, scrolling screen, bottom tabs; sheets slide over */
/* Layout: one-screen dark phone app — black canvas, soft grey cards, floating icon tab bar; sheets slide over */
:root{
  --bg:#000000; --surface:#161618; --surface-2:#222225; --ink:#F5F5F7; --muted:#8E8E93; --line:#2A2A2E;
  --brand:#F5F5F7; --brand-ink:#000000; --accent:#FF8A3D; --accent-soft:#2A1B10; --accent-ink:#FFB57A;
  --ok:#5BD08A; --ok-soft:#12261A; --gold:#F5C451; --gold-soft:#2B2210; --danger:#FF6B81;
  --grad:linear-gradient(100deg,#FFB547 0%,#FF7A59 45%,#E85BC4 100%);
  --a1:#6E7BFF; --a2:#FF8A3D; --a3:#E85BC4; --a4:#3CC9A0; --a5:#4AB4F0; --a6:#A57CFF;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --r:18px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.hdr{padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.hdr h1{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;flex:1;min-width:0;text-wrap:balance}
.hdr .sub{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.back{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
#main{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:0 max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="true"]{color:var(--brand)}
.tabs svg{width:22px;height:22px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px 0 2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.seg button .n{color:var(--muted);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] .n{color:inherit;opacity:.7}
.sect{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.stack{display:grid;gap:10px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:15px;color:#fff;background:var(--ac)}
.av.lg{width:72px;height:72px;font-size:24px}
.av.sm{width:30px;height:30px;font-size:11px;border:2px solid var(--surface)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;vertical-align:2px}
.pill.pro{background:var(--gold-soft);color:var(--gold)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--brand);color:var(--brand-ink);text-align:center}
.btn.acc{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hint{font-size:13px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 16px}
/* meeting hero */
.hero{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;display:grid;gap:12px;width:100%}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.hero h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.2}
.hero .m{font-size:13.5px;opacity:.85}
.faces{display:flex;align-items:center}
.faces .av{margin-right:-8px;border-color:var(--brand)}
.faces .more{margin-left:14px;font-size:13px;opacity:.85}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.hero .btn{background:var(--brand-ink);color:var(--brand);height:40px;font-size:14px}
.hero .btn.out{background:transparent;color:var(--brand-ink);border:1px solid currentColor}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%}
.mrow .date{width:46px;flex:none;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.mrow .date b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.1}
.mrow .date span{font-size:11.5px;color:var(--muted);text-transform:uppercase}
.mrow .t{flex:1;min-width:0}
.mrow .nm{font-weight:600}
/* match banner */
.match{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.match b{font-weight:600}
.match .who{display:flex;flex-wrap:wrap;gap:6px}
.match .who button{background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px 4px 4px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.match .who .av{width:24px;height:24px;font-size:10px;border:0}
/* person card */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.pcard .top{display:flex;gap:12px;align-items:center;width:100%}
.pcard .t{flex:1;min-width:0}
.pcard .nm{font-weight:600}
.pcard .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .note{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:7px 10px;color:var(--ink)}
.pcard .note::before{content:"Моя заметка: ";color:var(--muted)}
.pcard .flags{display:flex;gap:6px;flex-wrap:wrap}
.tick{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(8,10,20,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end;animation:fade .18s ease}
.sheet{width:100%;max-width:440px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.shd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shd h2{flex:1;margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.phead{display:flex;gap:14px;align-items:center;margin:-4px 0 14px}
.phead .nm{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2}
.biz{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;background:var(--surface)}
.biz .bn{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.biz .sp{font-size:12.5px;color:var(--muted)}
.offer{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:7px 10px;font-weight:500;font-size:13.5px;margin-top:4px}
.kv{display:grid;gap:12px}
.k{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:3px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field textarea{height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:none;width:100%}
.field textarea{height:76px;padding:10px 12px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{display:flex;gap:8px}
.met button{flex:1}
.met button[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
/* recall */
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center;display:grid;gap:10px;justify-items:center}
.rcard .nm{font-family:var(--f-display);font-size:22px;font-weight:700}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent)}
/* profile */
.bizcard{border-radius:20px;padding:18px;background:var(--brand);color:var(--brand-ink);display:grid;gap:12px;position:relative;overflow:hidden}
.bizcard::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:var(--accent)}
.bizcard > *{position:relative;z-index:1}
.bizcard .nm{font-family:var(--f-display);font-size:22px;font-weight:700;max-width:78%}
.bizcard .chip{background:transparent;border-color:currentColor;color:inherit}
.qrbox{background:#fff;border-radius:16px;padding:12px;display:grid;place-items:center;width:100%;max-width:220px;margin:0 auto}
.qrbox svg{width:100%;height:auto;display:block}
.code{font-family:var(--f-display);font-size:22px;letter-spacing:.12em;text-align:center;margin:10px 0 2px}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:6px;align-content:start}
.plan .pt{font-family:var(--f-display);font-weight:700;font-size:15px}
.plan .pp{font-size:13px;color:var(--muted)}
.plan ul{margin:0;padding-left:16px;font-size:13px;display:grid;gap:4px}
.plan .on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.lock{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:13.5px}
.web{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.web .bar{background:var(--surface-2);border-bottom:1px solid var(--line);padding:8px 12px;font-size:12px;color:var(--muted);text-align:center}
.web .bd{padding:16px;display:grid;gap:10px}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100% - 32px);animation:fade .2s ease}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* rich profile */
.ptop{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ptop .band{height:78px;background:var(--ac);position:relative;overflow:hidden}
.ptop .band::after{content:"";position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--accent);opacity:.85}
.ptop .band::before{content:"";position:absolute;left:38%;bottom:-70px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35)}
.ptop .pin{padding:0 16px 16px;margin-top:-38px;position:relative;display:grid;gap:4px}
.av.xl{width:80px;height:80px;font-size:28px;border:4px solid var(--surface)}
.pname{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;margin-top:6px;text-wrap:balance}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:500;text-align:center}
.qa button svg{width:20px;height:20px;color:var(--brand)}
.qa button[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
.qa button.savebtn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(232,121,43,.35)}
.qa button.savebtn svg{color:#fff}
.qa button.savebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.strip div{padding:10px 8px;text-align:center;border-right:1px solid var(--line)}
.strip div:last-child{border-right:0}
.strip b{display:block;font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.strip span{font-size:12px;color:var(--muted)}
.brand{display:grid;grid-template-columns:48px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.mono{width:48px;height:48px;border-radius:12px;background:var(--ac);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand .bn{font-weight:600}
.brand .sp{font-size:12.5px;color:var(--muted)}
.brand .t{min-width:0;display:grid;gap:3px}
.alist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.aw{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:center}
.aw:last-child{border-bottom:0}
.aw .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold)}
.aw .ic svg{width:18px;height:18px}
.aw .ic.k-press,.aw .ic.k-talk{background:var(--surface-2);color:var(--brand)}
.aw .ic.k-case{background:var(--ok-soft);color:var(--ok)}
.aw .at{font-weight:500;font-size:14.5px}
.aw .as{font-size:12.5px;color:var(--muted)}
.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.quote p{margin:0;font-size:14.5px}
.quote .by{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.quote .by .av{width:24px;height:24px;font-size:10px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .lk{width:84px;flex:none;font-size:13px;color:var(--muted)}
.lrow .lv{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;font-variant-numeric:tabular-nums}
.lrow button{font-size:13px;color:var(--brand);font-weight:600;flex:none}
.complete{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.complete .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.complete .bar i{display:block;height:100%;background:var(--ok)}
.todo{display:flex;flex-wrap:wrap;gap:6px}
.todo button{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px dashed var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.mut{display:flex;align-items:center;gap:10px}
.mut .faces .av{border-color:var(--surface)}
.bio{margin:14px 2px 0;font-size:15.5px;line-height:1.55;max-width:60ch}
button.brand{width:100%;text-align:left;grid-template-columns:48px 1fr auto;align-items:center}
button.brand:active{transform:scale(.99)}
.brand .bl{font-size:12.5px;color:var(--brand);font-weight:500}
.brand .chev,.fold .chev{color:var(--muted);display:grid;place-items:center}
.folds{display:grid;gap:8px;margin-top:18px}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.fold summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px;cursor:pointer;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
.fold .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;font-size:13.5px}
.fold summary .chev{margin-left:auto;transition:transform .2s}
details.fold[open] summary .chev{transform:rotate(90deg)}
.fold .fb{padding:0 14px 14px}
.fb .alist{border:0;background:transparent;border-radius:0}
.fb .lrow,.fb .aw{padding-left:0;padding-right:0}
.fb .quote{background:var(--surface-2);border:0}
.linkrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.linkrow:last-child{border-bottom:0}
.linkrow .li{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--brand);flex:none}
.linkrow .t{flex:1;min-width:0}
.linkrow .lv{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.linkrow .go{color:var(--brand);font-weight:600;font-size:13.5px}
.field select{height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%}

/* ---------- AI assistant ---------- */
.askbar{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 16px;border-radius:999px;background:var(--surface);color:var(--muted);font-size:14px;text-align:left}
.askbar svg{width:18px;height:18px;color:#FF8A3D;flex:none}
.askbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-intro{border-radius:24px;padding:20px;display:grid;gap:8px;color:#fff;background:radial-gradient(90% 100% at 0% 0%,#3A4BD8,transparent 60%),radial-gradient(90% 100% at 100% 0%,#E85BC4,transparent 60%),radial-gradient(100% 100% at 50% 120%,#FF8A3D,transparent 60%),#1a1a2a}
.ai-intro b{font-size:20px;letter-spacing:-.02em}
.ai-intro span{opacity:.85;font-size:14px}
.sugg{display:grid;gap:8px;margin-top:14px}
.sugg button{background:var(--surface);border-radius:16px;padding:12px 14px;text-align:left;font-size:14px}
.msgs{display:grid;gap:14px;margin-top:6px}
.msg-u{justify-self:end;max-width:85%;background:var(--surface-2);padding:10px 14px;border-radius:18px 18px 4px 18px}
.msg-a{display:grid;gap:10px}
.msg-a .txt{font-size:15px;line-height:1.5;color:#E5E5EA}
.msg-a .src{font-size:12px;color:var(--muted)}
.thinking{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--grad);animation:pulse 1s ease-in-out infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.rec{background:var(--surface);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.rec .top{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.rec .t{flex:1;min-width:0}
.rec .nm{font-weight:600}

const avatar=(p,cls='')=>(p.id==='p0'||p.id==='me')?`<span class="av ${cls}" style="${acol('p0')};background:var(--surface-2) url(${ME_PHOTO}) center/cover" role="img" aria-label="${esc(p.name)}"></span>`:`<span class="av ${cls}" style="${acol(p.id||'p0')}">${esc(ini(p.name))}</span>`;
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const dParts=s=>{const d=new Date(s+'T12:00:00');return {d:d.getDate(),m:MON[d.getMonth()]};};
const dLong=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
const stem=w=>w.toLowerCase().slice(0,Math.max(4,w.length-2));
function hay(p){ return [p.name,p.role,...p.helps,...p.biz.map(b=>`${b.name} ${b.sphere} ${b.desc}`)].join(' ').toLowerCase(); }
function matchQ(p,q){ if(!q.trim()) return true; const h=hay(p); return q.toLowerCase().split(/\s+/).filter(w=>w.length>1).every(w=>h.includes(stem(w))); }
// who can help me: their helps/biz match my seeks
function helpsMe(p){ return S.me.seeks.filter(s=>{const h=hay(p); return s.toLowerCase().split(/\s+/).every(w=>h.includes(stem(w)));}); }
// who needs me: their seeks match my helps / biz
function needsMe(p){ const mine=[...S.me.helps,...S.me.biz.map(b=>b.sphere)].join(' ').toLowerCase(); return p.seeks.filter(s=>s.toLowerCase().split(/\s+/).every(w=>mine.includes(stem(w)))); }

/* ---------- root ---------- */
function render(){
  const tabs=[['meetings','Знакомства',IC.cal],['people','Контакты',IC.people],['ai','Задачи и AI',IC.spark],['profile','Мой профиль',IC.card]];
  $('#tabs').innerHTML=tabs.map(([v,l,i])=>`<button data-tab="${v}" aria-current="${S.view===v}" aria-label="${l}" title="${l}">${i}${l}</button>`).join('');
  $('#tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.view=b.dataset.tab; S.pp=null; if(b.dataset.tab==='meetings') S.meeting=null; save(); render(); $('#main').scrollTop=0;});
  if(S.pp && byId(S.pp.id)) renderPersonPage();
  else if(S.view==='meetings') (S.meeting?renderMeeting():renderMeetings());
  else if(S.view==='people') renderPeople();
  else if(S.view==='ai') renderAI();
  else renderProfile();
  renderSheet();
}

function openMeeting(id){ S.meeting=id; S.q=''; S.filter='all'; save(); render(); $('#main').scrollTop=0; }

/* ---------- meeting page ---------- */
function renderMeeting(){
  const mt=MEETINGS.find(x=>x.id===S.meeting); const m=metMap(mt.id);
  const ppl=mt.people.map(byId);
  const counts={all:ppl.length,known:ppl.filter(p=>m[p.id]).length,unknown:ppl.filter(p=>m[p.id]===undefined).length,help:ppl.filter(p=>helpsMe(p).length).length,need:ppl.filter(p=>needsMe(p).length).length};
  let list=ppl.filter(p=>matchQ(p,S.q));
  if(S.filter==='known') list=list.filter(p=>m[p.id]); if(S.filter==='unknown') list=list.filter(p=>m[p.id]===undefined);
  if(S.filter==='help') list=list.filter(p=>helpsMe(p).length); if(S.filter==='need') list=list.filter(p=>needsMe(p).length);
  $('#hdr').innerHTML=`<div class="hdr"><button class="back" id="back" aria-label="Назад">${IC.back}</button><h1 style="font-size:18px">${mt.title}<span class="sub">${dLong(mt.date)} · ${esc(mt.place)}</span></h1></div>`;
  const top = mt.upcoming
   ? `<div class="hero"><span class="eyebrow">${dLong(mt.date)} · 10:00</span><h2>${mt.title}</h2><span class="m">${mt.people.length} записались. На встрече покажите QR: гости войдут одним сканом.</span>
      <span class="row-actions"><button class="btn" id="rsvp">${S.rsvp?'✓ Вы идёте':'Я приду'}</button><button class="btn out" id="qr">QR для входа</button></span></div>`
   : `<div class="row-actions"><button class="btn acc" style="flex:1" id="recall">Вспомнить: ${counts.unknown} не отмечены</button><button class="btn ghost" id="qr">QR</button></div>`;
  const F=mt.upcoming?[['all','Все']]:[['all','Все'],['known','Знаком'],['unknown','Не отмечены'],['help','Помогут мне'],['need','Нужен им я']];
  $('#main').innerHTML=`<div class="pad">${top}
   <div style="margin-top:12px"><label class="search">${IC.search}<input id="q" type="search" placeholder="Кто поможет с… / имя / компания" value="${esc(S.q)}" aria-label="Поиск по участникам"></label></div>
   <div class="seg">${F.map(([k,l])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${l}<span class="n">${counts[k]}</span></button>`).join('')}</div>
   <div class="stack" style="margin-top:10px">${list.length?list.map(p=>pcardHTML(p,mt)).join(''):`<div class="empty">Никого. Попробуйте «реклама», «юрист», «упаковка».</div>`}</div>
  </div>`;
  $('#back').onclick=()=>{S.meeting=null; save(); render();};
  const q=$('#q'); q.oninput=()=>{S.q=q.value; const p=q.selectionStart; renderMeeting(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f; save(); renderMeeting();});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open,mt.id));
  document.querySelectorAll('[data-tick]').forEach(b=>b.onclick=()=>{const id=b.dataset.tick; if(m[id]) delete m[id]; else m[id]=true; save(); renderMeeting();});
  const r=$('#recall'); if(r) r.onclick=()=>openRecall(mt.id);
  const rs=$('#rsvp'); if(rs) rs.onclick=()=>{S.rsvp=!S.rsvp; save(); renderMeeting(); toast(S.rsvp?'Вы записаны. Напомним за день':'Запись отменена');};
  $('#qr').onclick=()=>openSheet({type:'qr',mid:mt.id});
}
function pcardHTML(p,mt){
  const m=mt?metMap(mt.id):{}; const h=helpsMe(p), n=needsMe(p);
  return `<div class="pcard"><div class="top">
    <button class="top" data-open="${p.id}" style="flex:1;min-width:0">${avatar(p)}<span class="t"><span class="nm" style="display:block">${esc(p.name)} ${p.pro?'<span class="pill pro">PRO</span>':''}</span>
    <span class="ds" style="display:block">${esc([p.role,...(p.pro?p.biz.map(b=>b.name):[])].join(' · '))}</span>${!mt?`<span class="ds" style="display:block">${esc((MEETINGS.find(x=>!x.upcoming&&x.people.includes(p.id))||{}).title||'')}</span>`:''}</span></button>
    ${mt&&!mt.upcoming?`<button class="tick" data-tick="${p.id}" aria-pressed="${!!m[p.id]}" aria-label="Говорили с ${esc(p.name)}">${IC.check}</button>`:''}</div>
    ${(h.length||n.length||S.saved[p.id])?`<div class="flags">${h.map(x=>`<span class="pill ok">поможет: ${esc(x)}</span>`).join('')}${n.map(x=>`<span class="pill acc">ищет: ${esc(x)}</span>`).join('')}${S.saved[p.id]?'<span class="pill mute">в телефоне</span>':''}</div>`:''}
    ${S.notes[p.id]?`<div class="note">${esc(S.notes[p.id])}</div>`:''}</div>`;
}

/* ---------- people directory ---------- */
const inCat=(p,k)=>p.cat===k||(k==='mant'&&(p.orgs||[]).some(o=>/Манташянц/.test(o.n)));
const catCount=k=>P.filter(p=>inCat(p,k)).length;
function crow(p,showCat){ const c=CAT[p.cat];
  return `<button class="crow" data-open="${p.id}">${avatar(p)}<span class="t"><span class="nm">${esc(p.name)}${p.pro?' <span class="pill pro">PRO</span>':''}</span><span class="ds">${esc(p.role)}${p.pro&&p.biz[0]?' · '+esc(p.biz[0].name):''}${showCat?' · '+esc(c.name):''}</span></span></button>`; }
const byName=(a,b)=>a.name.localeCompare(b.name,'ru');
function renderPeople(){
  const az=S.cview==='az'; const cat=S.ccat&&CAT[S.ccat]?S.ccat:null; const q=(S.dq||'').trim();
  $('#hdr').innerHTML=`<div class="hdr"><h1>Контакты<span class="sub">${P.length} человек</span></h1><div class="vtog" role="tablist"><button data-cv="sec" aria-pressed="${!az}">Разделы</button><button data-cv="az" aria-pressed="${az}">А–Я</button></div></div>`;
  const PRI=['family','work','friends','repair','mant']; const pr=k=>{const i=PRI.indexOf(k); return i<0?99:i;};
  const used=CATS.filter(c=>catCount(c[0])).sort((x,y)=>(pr(x[0])-pr(y[0]))||(catCount(y[0])-catCount(x[0])));
  const chips=az?'':`<div class="cwrap"><div class="chiprow" id="chiprow"><button class="cchip${!cat?' on':''}" data-cat="">Все<span class="n">${P.length}</span></button>${used.map(([k,n,col,ic])=>`<button class="cchip${cat===k?' on':''}" data-cat="${k}" style="--ac:var(--a${col})">${ic}${n}<span class="n">${catCount(k)}</span></button>`).join('')}</div><button class="cchip more" id="morecats">Ещё ⌄</button></div>`;
  let body='';
  if(q){ const list=P.filter(p=>matchQ(p,q)||p.role.toLowerCase().includes(q.toLowerCase())).sort(byName);
    body=`<div class="sect">${list.length} найдено</div>`+(list.length?`<div class="clist">${list.map(p=>crow(p,true)).join('')}</div>`:`<div class="empty">Никого. Попробуйте спросить AI: «кто поможет с …»</div>`);
  } else if(az){
    const groups={}; P.slice().sort(byName).forEach(p=>{ const L=p.name[0].toUpperCase(); (groups[L]=groups[L]||[]).push(p); });
    body=Object.entries(groups).map(([L,ps])=>`<div class="lh" id="L-${L}">${L}</div><div class="clist">${ps.map(p=>crow(p,true)).join('')}</div>`).join('');
    body+=`<div class="rail" id="rail">${[...'АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ'].map(x=>groups[x]?`<button data-L="${x}" class="has">${x}</button>`:`<span>${x}</span>`).join('')}</div>`;
  } else if(cat){ const c=CAT[cat]; const list=P.filter(p=>inCat(p,cat)).sort(byName);
    body=`<div class="gh" style="--ac:var(--a${c.col})"><button class="ghb" data-cat="">‹</button>${c.icon}${c.name}<span class="n">${list.length}</span></div><div class="clist">${list.map(p=>crow(p,false)).join('')}</div>`;
  } else {
    body=used.map(([k,n,col,ic])=>{ const list=P.filter(p=>inCat(p,k)).sort(byName);
      return `<div class="gh" style="--ac:var(--a${col})">${ic}${n}<span class="n">${list.length}</span>${list.length>3?`<button class="all" data-cat="${k}">Все ›</button>`:''}</div><div class="clist">${list.slice(0,3).map(p=>crow(p,false)).join('')}</div>`; }).join('');
  }
  $('#main').innerHTML=`<div class="pad${az&&!q?' azpad':''}"><label class="search">${IC.search}<input id="dq" type="search" placeholder="Имя, роль или «кто чинит двери»" value="${esc(S.dq||'')}" aria-label="Поиск по контактам"></label>${chips}${body}</div>`;
  const qi=$('#dq'); qi.oninput=()=>{S.dq=qi.value; const p=qi.selectionStart; renderPeople(); const n=$('#dq'); n.focus(); n.setSelectionRange(p,p);};
  document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{S.cview=b.dataset.cv; S.ccat=null; save(); renderPeople(); $('#main').scrollTop=0;});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.ccat=b.dataset.cat||null; S.dq=''; save(); renderPeople(); $('#main').scrollTop=0;});
  document.querySelectorAll('#main [data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open,null));
  document.querySelectorAll('[data-L]').forEach(b=>b.onclick=()=>{ const el=document.getElementById('L-'+b.dataset.L); if(el) $('#main').scrollTop=el.offsetTop-8; });
  const mc=$('#morecats'); if(mc) mc.onclick=()=>openSheet({type:'cats'});
  const on=document.querySelector('#chiprow .cchip.on'); if(on&&cat) on.scrollIntoView({inline:'center',block:'nearest'});
}

  if(!free&&((p.orgs||[]).length||isMe)) out+=sec(`Членство в организациях${(p.orgs||[]).length?' · '+p.orgs.length:''}`)+((p.orgs||[]).length?`<div class="alist">${p.orgs.map(o=>`<div class="org"><span class="oi">${esc(ini(o.n.replace(/^Пример: /,'').replace(/[«»"]/g,'')))}</span><div class="t"><div class="on">${esc(o.n)}</div><div class="os">${esc(o.r)}${o.y?' · с '+o.y:''}</div></div>${o.v?'<span class="ov ok">✓ Подтверждено</span>':'<span class="ov">Не подтверждено</span>'}</div>`).join('')}</div>`:`<div class="hint">Добавьте клубы, палаты и ассоциации, в которых вы состоите.</div>`);

  const flat=(t,n,inner)=>sec(`${t}${n?' · '+n:''}`)+inner;

    const aw=p.awards||[], cs=p.cases||[];
    if(aw.length||isMe) F0+=flat('Награды и достижения',aw.length,aw.length?`<div class="alist">${aw.map(a=>`<div class="aw"><span class="ic k-${a.k}">${(KIND[a.k]||KIND.medal)[1]}</span><div style="min-width:0"><div class="at">${esc(a.t)}</div><div class="as">${(KIND[a.k]||KIND.medal)[0]} · ${esc([a.y,a.src].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`:`<div class="hint">Добавьте медали, сертификаты, публикации и выступления.</div>`);
    if(cs.length) F0+=flat('Кейсы',cs.length,`<div class="stack">${cs.map(c=>`<div class="card"><b>${esc(c.t)}</b><div class="hint">${esc(c.d)}</div></div>`).join('')}</div>`);

    F0+=flat('Рекомендации',endorse.length,(endorse.length?`<div class="stack">${endorse.map(e=>{const f=fromP(e.from);return `<div class="quote"><p>${esc(e.text)}</p><div class="by">${avatar(f)}${esc(f.name)}${e.from==='me'?' (вы)':''}</div></div>`;}).join('')}</div>`:`<div class="hint">Пока никто не рекомендовал.</div>`)

  }
  F+=fold('Где пересекались',where.length,`<div class="kv"><div><div class="k">События</div>${where.map(x=>`${x.title}, ${dLong(x.date)}`).join('<br>')||'Пока не было'}</div>
    ${mutual.length?`<div><div class="k">Вы оба знаете</div><div class="mut"><span class="faces">${mutual.map(x=>avatar(x,'sm')).join('')}</span><span class="hint" style="margin-left:6px">${esc(mutual.map(x=>x.name.split(' ')[0]).join(', '))}</span></div></div>`:''}</div>`);
  if(!isMe){
    F+=fold('Моя заметка',S.notes[p.id]?'✎':null,(mt&&!mt.upcoming?`<div class="met" style="margin-bottom:12px"><button class="btn ghost" id="talk" aria-pressed="${m[p.id]===true}">${m[p.id]?'✓ Говорили':'Мы говорили'}</button><button class="btn ghost" id="notalk" aria-pressed="${m[p.id]===false}">Не общались</button></div>`:'')
      +`<div class="field" style="margin:0"><label for="note">Видите только вы</label><textarea id="note" placeholder="О чём говорили, что обещали…">${esc(S.notes[p.id]||'')}</textarea></div>`,'notef');
  }
  out+=F0+`<div class="folds">${F}</div>`;
  if(isMe){
    out+=`<div class="sect">Демо</div><div class="row-actions" id="rz"><button class="btn ghost sm" id="reset">Сбросить демо</button></div>`;
  }
  return out;
}

    $('#ends').onclick=()=>{ const v=$('#endt').value.trim(); if(!v){ $('#endt').focus(); return; } S.endorsed[p.id]=v; save(); renderPersonPage(true); toast('Рекомендация опубликована'); }; };

function readEdit(){
  const me=S.me; const v=id=>(document.getElementById(id)?.value||'').trim(); const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
  me.name=v('e-name')||me.name; me.role=v('e-role'); me.city=v('e-city'); me.langs=list(v('e-langs'));
  me.helps=list(v('e-help')); me.seeks=list(v('e-seek'));
  me.bio=v('e-bio');
  me.biz=me.biz.map((b,i)=>({name:v('b-n'+i),sphere:v('b-s'+i),year:v('b-y'+i),team:v('b-t'+i),desc:v('b-d'+i),offer:v('b-o'+i),links:{...(b.links||{}),instagram:v('b-ig'+i),site:v('b-web'+i),facebook:v('b-fb'+i)}}));
  me.orgs=(me.orgs||[]).map((o,i)=>({n:v('o-n'+i),r:v('o-r'+i),y:v('o-y'+i),v:!!o.v}));
  me.awards=(me.awards||[]).map((a,i)=>({t:v('w-t'+i),y:v('w-y'+i),k:document.getElementById('w-k'+i)?.value||'medal',src:v('w-s'+i)}));
  me.links={whatsapp:v('l-wa'),instagram:v('l-ig'),linkedin:v('l-li'),site:v('l-site'),email:v('l-mail')}; me.tg=v('l-tg');
  me.askMe=v('e-ask'); me.edu=v('e-edu'); me.interests=list(v('e-int'));
}

const SYN={двер:['двер','интерьер','ремонт','строит','мебел'],бухгалт:['бухгалт','налог','отчёт','юрист'],упаков:['упаков','печат','дизайн упаковки','брендинг'],тимбилд:['тимбилд','тур','площадк','ивент','мероприят'],

const STOP=['нужн','реши','вопр','ново','офис','хочу','помо','кому','нуже','провест','команд','челов','надо','ищу','найти','сдела','можн'];
function offlineFind(q){
  const words=q.toLowerCase().match(/[a-zа-яё]{4,}/g)||[];
  const keys=Object.keys(SYN).filter(k=>words.some(w=>w.startsWith(k.slice(0,4))));
  const stems=words.map(w=>w.slice(0,Math.max(4,w.length-3))).filter(st=>!STOP.some(x=>st.startsWith(x)));
  const out=[];
  P.forEach(p=>{ const h=hay(p)+' '+(S.notes[p.id]||'').toLowerCase(); let kind=null, hit='';
    if(keys.length){ keys.forEach(k=>{ if(!kind&&h.includes(SYN[k][0])){kind='direct';hit=SYN[k][0];} });
      if(!kind) keys.forEach(k=>SYN[k].slice(1).forEach(r=>{ if(!kind&&h.includes(r)){kind='indirect';hit=r;} })); }
    else stems.forEach(st=>{ if(!kind&&h.includes(st)){kind='direct';hit=st;} });
    if(kind) out.push({id:p.id,kind,why:kind==='direct'?`${p.role}: в профиле есть «${hit}».`:`${p.role}: по работе связан с «${hit}» и может знать нужных людей.`,ask:`Здравствуйте, ${p.name.split(' ')[0]}! Это ${S.me.name}. Подскажите, пожалуйста: ${q.replace(/[.!?]+$/,'').toLowerCase()}. Сможете помочь или посоветовать кого-то?`});
  });
  out.sort((a,b)=>(a.kind==='direct'?0:1)-(b.kind==='direct'?0:1));
  const top=out.slice(0,4);
  return {reply:top.length?'Вот кто из ваших контактов может помочь.':'Среди ваших контактов никто явно не подходит. Попробуйте описать задачу другими словами.',people:top};
}
function aiHistory(chat){

  chat.filter(m=>!m.pending).slice(-6).forEach(m=>{

    else turns.push({role:'assistant',content:m.text+(m.people?.length?' Предложенные: '+m.people.map(x=>byId(x.id)?.name).join(', '):'')});
  });
  return turns;
}

  const status = t.status==='done'
    ? `<div class="donebar"><span>✓ Решено${t.helper?` · помог(ла) <b>${esc(byId(t.helper).name)}</b>`:''}</span><button class="btn ghost sm" id="reopen">Вернуть в работу</button></div>`
    : (S.closing?`<div class="donebar" style="display:grid;gap:10px"><span>Кто помог решить?</span><div class="chips">${ids.map(id=>`<button class="chip pick" data-helper="${id}">${avatar(byId(id),'sm')} ${esc(byId(id).name.split(' ')[0])}</button>`).join('')}<button class="chip pick" data-helper="">Решил сам</button></div></div>`
    : `<button class="btn ghost wide" id="close">✓ Отметить решённой</button>`);
  $('#main').innerHTML=`<div class="pad ai-pad">${status}
   <div class="msgs" style="margin-top:14px">${t.chat.map(m=>m.role==='user'?`<div class="msg-u">${esc(m.text)}</div>`:
     m.pending?`<div class="msg-a"><div class="thinking"><i></i><i></i><i></i>Смотрю ваши контакты…</div>${aiCtl?'<button class="btn ghost sm" id="aistop" style="justify-self:start">Остановить</button>':''}</div>`:
     `<div class="msg-a"><div class="txt">${esc(m.text)}</div>${(m.people||[]).map(recHTML).join('')}${m.src?`<div class="src">${esc(m.src)}</div>`:''}</div>`).join('')}</div>
   </div>${composerHTML('Уточнить: например, кто ближе к Дилижану?')}`;
  $('#back').onclick=()=>{S.task=null; S.closing=false; save(); renderAI();};
  const c=$('#close'); if(c) c.onclick=()=>{S.closing=true; renderAI();};
  const r=$('#reopen'); if(r) r.onclick=()=>{t.status='open'; t.helper=null; save(); renderAI();};
  document.querySelectorAll('[data-helper]').forEach(b=>b.onclick=()=>{t.status='done'; t.helper=b.dataset.helper||null; S.closing=false; save(); renderAI(); toast('Задача решена');});
  document.querySelectorAll('#main [data-open]').forEach(b=>b.onclick=()=>openPerson(b.dataset.open,null));
  document.querySelectorAll('#main [data-copy]').forEach(b=>b.onclick=()=>{ const v=b.dataset.copy; (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(`${b.dataset.what} скопирован`),()=>toast(v)); });
  const st=$('#aistop'); if(st) st.onclick=()=>aiCtl?.abort();
  bindComposer(t);
  if(scrollEnd) $('#main').scrollTop=$('#main').scrollHeight;
}
/* inline voice recording (demo text) */
let recTimer=null;
function startRec(t){
  const phrase=t?'А кто из них ближе к Дилижану и сможет на этой неделе?':'Нужно решить вопрос с дверями в новом офисе';
  const f=$('#aif'); f.classList.add('recording');
  const bars=Array.from({length:34},(_,i)=>`<i style="animation-delay:${(i*53)%700}ms"></i>`).join('');
  f.innerHTML=`<div class="rtext" id="rtext"><span class="rph">Говорите…</span></div>
   <div class="rbar"><button type="button" class="rbtn" id="rcancel" aria-label="Отменить">${IC.x}</button>
   <div class="wave" id="wave">${bars}</div>
   <button type="button" class="rbtn" id="rstop" aria-label="Остановить запись"><span class="sq"></span></button>
   <button type="submit" class="send" aria-label="Отправить">${SENDI}</button></div>
   <div class="rdemo">Демо: в приложении здесь будет распознавание речи</div>`;
  let i=0; const words=phrase.split(' '); const out=$('#rtext');
  const step=()=>{ i++; out.innerHTML=esc(words.slice(0,i).join(' '))+(i<words.length?'<span class="caret"></span>':''); if(i<words.length) recTimer=setTimeout(step,260); else stop(); };
  const stop=()=>{ clearTimeout(recTimer); f.classList.add('stopped'); const sb=$('#rstop'); if(sb) sb.hidden=true; };
  recTimer=setTimeout(step,600);
  $('#rstop').onclick=stop;
  $('#rcancel').onclick=()=>{ clearTimeout(recTimer); renderAI(); };
  f.onsubmit=e=>{ e.preventDefault(); clearTimeout(recTimer); const txt=words.slice(0,Math.max(i,1)).join(' '); aiSend(txt,t); };
}
/* voice (demo) */
const VOICE_DEMO='Нужно решить вопрос с дверями в новом офисе';
let voiceTimer=null;
function shVoice(){ return `${head('')}<div class="voice"><div class="orb" id="orb">${MIC}</div><div class="vt" id="vt">Слушаю…</div><div class="hint" id="vh">Скажите задачу, например «нужны двери для офиса»</div>
  <div class="row-actions" style="justify-content:center"><button class="btn ghost sm" data-close>Отмена</button><button class="btn sm" id="vdone" disabled>Отправить</button></div>
  <div class="hint" style="font-size:12px;margin-top:6px">Демо: в приложении здесь будет распознавание речи</div></div>`; }
function bVoice(){
  clearTimeout(voiceTimer); let i=0; const vt=$('#vt');
  const step=()=>{ if(!sheet||sheet.type!=='voice') return; i+=3; vt.textContent=VOICE_DEMO.slice(0,i)+(i<VOICE_DEMO.length?'…':''); if(i<VOICE_DEMO.length) voiceTimer=setTimeout(step,70); else { $('#vh').textContent='Готово. Отправить?'; $('#vdone').disabled=false; } };
  voiceTimer=setTimeout(step,700);
  $('#vdone').onclick=()=>{ const tid=sheet.task; const t=tid?tasks().find(x=>x.id===tid):null; sheet=null; renderSheet(); aiSend(VOICE_DEMO,t); };
}

render();
